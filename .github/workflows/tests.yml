name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: Tests du banc (Windows, Python 3.14)
    runs-on: windows-latest
    env:
      # Racine des données du banc (le défaut du dépôt, ignoré par git) ; les tests de
      # correction lisent NLTK dessous. Le contexte runner n'existe pas dans env de job.
      QUALITY_BENCH_DATA: ${{ github.workspace }}\data\quality_bench

    steps:
    - uses: actions/checkout@v7

    # 3.14 : version de développement, déclarée dans pyproject.toml (requires-python).
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: |
          requirements.txt
          pyproject.toml

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Les empreintes sha256 des archives NLTK sont épinglées dans nltk_data.py : la clé change
    # avec elles.
    - name: Cache NLTK data
      uses: actions/cache@v6
      with:
        path: ${{ github.workspace }}\data\quality_bench\nltk_data
        key: nltk-data-${{ runner.os }}-${{ hashFiles('slm_quality_bench/questions/importers/nltk_data.py') }}

    # Seule étape réseau du job : ne retélécharge pas un paquet déjà présent avec la bonne
    # empreinte.
    - name: Fetch NLTK data
      run: python -m slm_quality_bench fetch-nltk

    - name: Run tests
      run: python -m pytest -q

  lint:
    name: Qualité du code (ruff, black, isort)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install dev tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff black isort

    - name: Run Ruff
      run: ruff check .

    - name: Check Black
      run: black --check .

    - name: Check isort
      run: isort --check-only .
