# Jeu set-v3 du banc de qualité difficile, pour la campagne complète full-20261018 :
# 800 questions en think_off, et la piste think_on sur TOUTES (800). Lu par
# common/config.load_set ; construit par `python -m slm_quality_bench build-set --set set-v3`.
# Mêmes sources, comptes, exclusions, graine, historique multi-tours et fichier writing-fr-v2.yaml
# que set-v2 (set-v2 reste intact) ; seul le bloc think_on change : décision d'Anaël du
# 2026-10-18 après le pilote pilot-20261017, la piste think_on passe sur toutes les questions du
# jeu (au lieu de 400 sur 800 en set-v2), chaque effectif think_on égalant l'effectif think_off
# de l'usage (somme des count des sources de l'usage ; les exclusions de bfcl-live ne changent
# pas le count).
# Les sources sont tirées dans cet ordre : un groupe pris par une source est exclu des suivantes
# (tools-fr, traductions de bfcl-live, vient donc avant bfcl-live).
set: set-v3
seed: 20261011
# Palier num_ctx de bfcl-multi avec l'historique des tours (AD-5).
multi_turn_history: true
# Plafonds de réponse pour lesquels les paliers num_ctx sont dimensionnés (AD-5) : ceux de la
# campagne full-20261018 (4 096 partout, RAG 2 048). Sans eux, les paliers suivraient les
# plafonds par défaut (2 048 hors raisonnement) et la campagne serait refusée par build_plan.
# Les longueurs des contextes OneRuler sont calibrées sur ces plafonds.
caps: {think_off: {default: 4096, rag: 2048}, think_on: {default: 4096, reasoning: 4096, rag: 2048}}
sources:
  # reasoning : 130
  - {source: var-math-fr, count: 60, generator_seed: 1, generator_params: {variants: 3}}
  - {source: bbeh-mini, count: 70}
  # instructions : 130
  - {source: instructions-fr, count: 30}
  - {source: mifeval-fr, count: 50}
  - {source: ifbench, count: 50}
  # tools : 130
  - {source: tools-fr, count: 30}
  - {source: bfcl-multi, count: 30}
  - {source: bfcl-parallel, count: 20}
  # exclude : cibles défectueuses dans BFCL lui-même, qu'aucune réponse ne peut passer, même
  # avec le correcteur amont (révision épinglée 6ea57973 ; ids de questions, id BFCL en regard).
  - source: bfcl-live
    count: 50
    exclude:
      - tools/bfcl-live/0107  # live_simple_106-63-0 : paramètres requis sans valeur possible
      - tools/bfcl-live/0113  # live_simple_112-68-0 : paramètres requis sans valeur possible
      - tools/bfcl-live/0766  # live_multiple_507-149-4 : origin_airport requis, seule son omission admise
      - tools/bfcl-live/1121  # live_multiple_862-181-3 : paramètre journey_start_time non déclaré
      - tools/bfcl-live/1223  # live_multiple_964-207-0 : paramètre question non déclaré (statement)
  # extraction : 110
  - {source: extraction-fr, count: 30}
  - {source: jsonschemabench, count: 80}
  # rag : 110
  - {source: oneruler-fr-niah, count: 36, generator_seed: 2}
  - {source: oneruler-fr-cwe, count: 24, generator_seed: 3}
  - {source: piaf, count: 50, per_group: 1}
  # abstention : 110
  - {source: oneruler-fr-none, count: 30, generator_seed: 4}
  - {source: abstention-fr, count: 30}
  - {source: bfcl-irrelevance, count: 50}
  # writing : 80
  - {source: writing-fr, count: 80, file: writing-fr-v2.yaml}
think_on:
  reasoning: 130
  instructions: 130
  tools: 130
  extraction: 110
  rag: 110
  abstention: 110
  writing: 80
