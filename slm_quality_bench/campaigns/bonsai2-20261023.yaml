# Campagne bonsai2-20261023 : les trois tailles (2B, 4B, 9B) de Ternary Bonsai 2 (PrismML) sur
# set-v3, pour mesurer ce que coûte la compression ternaire (~1,58 bit) face à leurs bases.
# Décision d'Anaël du 2026-10-26 : la campagne est scindée ; Bolt-E4B (ajouté le 2026-10-24)
# passe dans admission-20261026 (Ollama 0.40.5), car Ollama ne lit le format Q2_0 qu'à partir de
# 0.40.6 (notes de version : « v0.40.6 (16 oct.) : adds q2_0 tensor and file types »).
# Décision d'Anaël du 2026-10-29 : la campagne est de nouveau scindée ; les références Qwen
# (qwen3.5:2b, qwen3.5:4b) sont rejouées dans replay-20261029, qui se lance juste après. Raison :
# depuis la PR #31, un juge refuse une campagne dont la génération est en cours ; Anaël veut
# juger les Bonsai 2 par le juge cloud pendant que les Qwen rejoués tournent. L'identifiant reste
# bonsai2-20261023 (non lancée : aucune ligne générée). Décision d'Anaël du 2026-10-23 pour les
# Bonsai 2, sans notation indépendante (aucune page Artificial Analysis au 2026-10-23 : chiffres
# du fournisseur seulement ; cela remplace la décision du 2026-10-18 « pas d'ajout sans notation »).
# COMPARAISON : Bonsai 2 2B et 4B contre leur base, rejouée sous le même moteur (0.40.13) dans
# replay-20261029. Bonsai 2 9B contre le qwen3.5:9b de full-20261018 (Ollama 0.40.5) : comparaison
# indicative, marquée † (le moteur diffère ; seule la version d'Ollama change, tout le reste est
# identique). qwen3.5:9b n'est pas rejoué (règle du 2026-10-29 : 18,9 h et 32/34 couches seulement
# sur le GPU à 16 384, donc des couches sur le CPU et moins de 1 Gio de marge (règle non tenue) ; voir docs/deferred-work.md). Contre les autres modèles de
# full-20261018, la comparaison n'est qu'indicative aussi.
# ORDRE de lancement : full-20261018 et ses juges, puis admission-20261026 (arrêtée par STOP le
# 2026-10-29) et ses juges, puis mise à jour d'Ollama vers 0.40.13 par Anaël, puis flint-20261029,
# puis cette campagne, puis replay-20261029 juste après. Le juge cloud de cette campagne tourne
# pendant la génération de replay-20261029, celui de flint-20261029 pendant la sienne.
# Mêmes réglages que full-20261018 (set, K = 1, plafonds, paliers, contrôle du GPU, juge), sauf la
# version d'Ollama (0.40.13). Licence Apache 2.0, contexte annoncé 262 144, lignée Qwen « thinking ».
# Format Q2_0, le seul que PrismML dit lisible par llama.cpp amont (b11555 et plus, affirmation du
# fournisseur, docs.prismml.com/download/models, non vérifiée sous Ollama) : PTQ1_0 et PQ2_0
# exigent les binaires de PrismML, exclus. Tailles et références au banc :
#   - 2B, 0,55 Go, base Qwen3.5 2B (sorti le 2026-10-15) ; référence qwen3.5:2b (replay) ;
#   - 4B, 1,21 Go, base Qwen3.5 4B (sorti le 2026-10-15), déjà installé sur la tour ; référence
#     qwen3.5:4b (replay) ;
#   - 9B, 2,56 Go, base Qwen3.5 9B ; référence qwen3.5:9b de full-20261018 (†).
# Décision d'Anaël du 2026-10-23 : le 27B (`hf.co/prism-ml/Ternary-Bonsai-2-27B-gguf-dev:Q2_0`,
# 7,63 Go, base Qwen3.8 27B) est retiré de la campagne, car sa durée projetée n'est pas mesurée
# (30 à 130 h, décharge sur le CPU : il ne tient pas dans les 8 Go de VRAM de la RTX 3050 avec son
# cache) et il n'a pas de modèle d'origine au banc. À réexaminer avec une carte à plus de VRAM ou
# après une mesure de débit.
# Bolt-E4B, ajouté le 2026-10-24, est passé le 2026-10-26 dans admission-20261026 (voir ce fichier
# pour sa description et le contrôle « think_off honoré »).
# Conduite décidée d'avance : si `ollama pull` ou `precheck` refuse une taille sous Ollama 0.40.13
# (ou une piste : valeurs think), la retirer de models (ou restreindre tracks) par une PR AVANT le
# premier `generate` (aucune ligne générée : la section generation peut encore changer), accord
# donné d'avance par Anaël le 2026-10-23.
# Ordre : débit présumé décroissant (2B, 4B, 9B). Débits d'éval mesurés dans full-20261018 pour les
# bases : qwen3.5:2b 83 tok/s, qwen3.5:4b 58, qwen3.5:9b 36.
# Projection de durée (grossière, à mesurer par status) : Bonsai 2 31 à 50 h au total (0,8 à 1,3
# fois sa base : 2B 7 à 11 h, 4B 9 à 15 h, 9B 15 à 25 h). Règle du 2026-10-29 (au plus 20 h
# projetées par modèle) : le 9B est surveillé (`status --watch`) et arrêté par STOP si ses
# premières lignes projettent au-delà de 20 h. La compression ternaire peut changer débit et
# verbosité (les Qwen 3.5 bouclent en think_on : 43 à 72 % de lignes tronquées).
# Prérequis : lancer après la fin de full-20261018, d'admission-20261026 et de leurs juges
# (machine.lock : un juge local ne tourne pas pendant une génération ; un juge cloud peut juger une
# campagne finie pendant celle-ci) ; télécharger 2B et 9B (~3,1 Go : 0,55 + 2,56 ; le 4B est déjà
# installé) seulement après admission-20261026 ; `$env:QUALITY_BENCH_MACHINE = "tour-rtx3050"` ;
# `precheck --campaign bonsai2-20261023` avant `generate`, dans un terminal à part.
# La section grading n'est pas bloquante : le juge retenu peut changer sans nouvel identifiant.
# Juge opus comme full-20261018 (comparabilité) : couvert par les crédits Opus d'Anaël, renouvelés
# chaque mois (précision du 2026-10-26) ; repère de coût ~2,85 $ / 1 000 critères.
set: set-v3
# Version d'Ollama attendue (precheck et generate refusent une autre version) : 0.40.13 (sortie le 2026-10-28, supporte toujours Q2_0, ajouté en 0.40.6 ; Flint depuis 0.40.9, LFM3 sous Windows depuis 0.40.13), version
# la plus récente (décidée le 2026-10-29) ; seul réglage différent de full-20261018 (0.40.5), à confirmer par precheck.
ollama_version: "0.40.13"
generation:
  request: {temperature: 0, seed_base: 0, k: 1}
  caps: {think_off: {default: 4096, rag: 2048}, think_on: {default: 4096, reasoning: 4096, rag: 2048}}
  num_ctx_tiers: [4096, 8192, 16384, 32768]
  # Valeur de think par piste : false (think_off) et true (think_on) pour un modèle qui déclare
  # « thinking ». Les valeurs think des trois Bonsai 2 (lignée Qwen thinking) sont À CONFIRMER par `precheck` (préflight /api/show) avant `generate` : restreindre tracks si /api/show ne
  # publie qu'une valeur. num_ctx_max : 32768, le palier le plus haut (contexte déclaré 262 144).
  # family bonsai2 (décision d'Anaël du 2026-10-23) : famille à part, ni qwen (lignée de leurs
  # bases) ni bonsai (Bonsai 1 bit de première génération : bonsai:8b-q1_0, bonsai:27b-q1_0).
  # Effet : la mesure qwen_bias de la calibration (AD-16, family == "qwen") les compte non-Qwen.
  models:
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-2B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-4B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-9B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
grading:
  judge: opus
# Overwolf (overlay de la tour) reste listé par nvidia-smi : toléré par son nom, la règle de
# mémoire à vide continue de s'appliquer.
gpu_check:
  allowed_processes: [Overwolf.exe]
