# Campagne bonsai2-20261023 : trois tailles (2B, 4B, 9B) de Ternary Bonsai 2 (PrismML) sur
# set-v3, pour mesurer ce que coûte la compression ternaire (~1,58 bit) face à leurs bases, que
# la campagne REJOUE ici (qwen3.5:2b, qwen3.5:4b, qwen3.5:9b, entrées de full-20261018 reprises
# telles quelles) : 6 modèles. Décision d'Anaël du 2026-10-26 : la campagne est scindée ; Bolt-E4B
# (ajouté le 2026-10-24) passe dans admission-20261026 (Ollama 0.40.5), car Ollama ne lit le format
# Q2_0 qu'à partir de 0.40.6 (notes de version : « v0.40.6 (16 oct.) : adds q2_0 tensor and file
# types »). L'identifiant reste bonsai2-20261023 (non lancée : aucune ligne générée). Décision
# d'Anaël du 2026-10-23 pour les Bonsai 2, sans notation indépendante (aucune page Artificial Analysis au 2026-10-23 : chiffres
# du fournisseur seulement ; cela remplace la décision du 2026-10-18 « pas d'ajout sans notation »).
# COMPARAISON : Bonsai 2 contre sa base, DANS cette campagne (même moteur, 0.40.6, mêmes réglages).
# Contre les autres modèles de full-20261018 (Ollama 0.40.5), la comparaison n'est
# qu'indicative : le moteur diffère (seule la version d'Ollama change, tout le reste est identique).
# ORDRE de lancement : full-20261018 et ses juges, puis admission-20261026 en 0.40.5, puis mise à
# jour d'Ollama vers 0.40.6 par Anaël, puis cette campagne. Ne pas mettre Ollama à jour avant la fin
# d'admission-20261026.
# Mêmes réglages que full-20261018 (set, version d'Ollama, K = 1, plafonds, paliers, contrôle du
# GPU, juge) pour que les résultats se comparent directement, ligne à ligne, à ceux de la
# campagne complète. Licence Apache 2.0, contexte annoncé 262 144, lignée Qwen « thinking ».
# Format Q2_0, le seul que PrismML dit lisible par llama.cpp amont (b11555 et plus, affirmation du
# fournisseur, docs.prismml.com/download/models, non vérifiée sous Ollama) : PTQ1_0 et PQ2_0
# exigent les binaires de PrismML, exclus. Tailles et références au banc :
#   - 2B, 0,55 Go, base Qwen3.5 2B (sorti le 2026-10-15) ; référence qwen3.5:2b ;
#   - 4B, 1,21 Go, base Qwen3.5 4B (sorti le 2026-10-15), déjà installé sur la tour ; référence
#     qwen3.5:4b ;
#   - 9B, 2,56 Go, base Qwen3.5 9B ; référence qwen3.5:9b.
# Décision d'Anaël du 2026-10-23 : le 27B (`hf.co/prism-ml/Ternary-Bonsai-2-27B-gguf-dev:Q2_0`,
# 7,63 Go, base Qwen3.8 27B) est retiré de la campagne, car sa durée projetée n'est pas mesurée
# (30 à 130 h, décharge sur le CPU : il ne tient pas dans les 8 Go de VRAM de la RTX 3050 avec son
# cache) et il n'a pas de modèle d'origine au banc. À réexaminer avec une carte à plus de VRAM ou
# après une mesure de débit.
# Bolt-E4B, ajouté le 2026-10-24, est passé le 2026-10-26 dans admission-20261026 (voir ce fichier
# pour sa description et le contrôle « think_off honoré »).
# Conduite décidée d'avance : si `ollama pull` ou `precheck` refuse une taille sous Ollama 0.40.6
# (ou une piste : valeurs think), la retirer de models (ou restreindre tracks) par une PR AVANT le
# premier `generate` (aucune ligne générée : la section generation peut encore changer), accord
# donné d'avance par Anaël le 2026-10-23. Une base est à garder tant que son Bonsai 2 reste.
# Ordre : débit présumé décroissant, chaque Bonsai 2 suivi de sa base (2B, 4B, 9B) pour que les
# paires se terminent ensemble. Débits d'éval mesurés dans full-20261018 : qwen3.5:2b 83 tok/s,
# qwen3.5:4b 58, qwen3.5:9b 36.
# Projection de durée (grossière) : Bonsai 2 30 à 50 h pour les trois, plus les références rejouées
# (durées réelles de full-20261018 : qwen3.5:2b 8,3 h, qwen3.5:4b ~10 h extrapolées ; qwen3.5:9b
# sans durée mesurée au 2026-10-26, projection de 15 à 25 h à mesurer par status), soit 63 à 93 h
# pour les six. La compression ternaire peut changer débit et verbosité (les Qwen 3.5 bouclent en
# think_on : 43 à 72 % de lignes tronquées).
# Prérequis : lancer après la fin de full-20261018 et de ses juges (machine.lock : juge et
# génération ne tournent pas ensemble) ; télécharger 2B et 9B (~3,1 Go : 0,55 + 2,56 ;
# le 4B et les références qwen3.5 sont déjà installés) seulement après admission-20261026 ; `$env:QUALITY_BENCH_MACHINE = "tour-rtx3050"` ; `precheck --campaign
# bonsai2-20261023` avant `generate`, dans un terminal à part.
# La section grading n'est pas bloquante : le juge retenu peut changer sans nouvel identifiant.
set: set-v3
# Version d'Ollama attendue (precheck et generate refusent une autre version) : 0.40.6, première
# version qui lit Q2_0 ; seul réglage différent de full-20261018 (0.40.5), à confirmer par precheck.
ollama_version: "0.40.6"
generation:
  request: {temperature: 0, seed_base: 0, k: 1}
  caps: {think_off: {default: 4096, rag: 2048}, think_on: {default: 4096, reasoning: 4096, rag: 2048}}
  num_ctx_tiers: [4096, 8192, 16384, 32768]
  # Valeur de think par piste : false (think_off) et true (think_on) pour un modèle qui déclare
  # « thinking ». Les valeurs think des trois Bonsai 2 (lignée Qwen thinking) sont À CONFIRMER par `precheck` (préflight /api/show) avant `generate` : restreindre tracks si /api/show ne
  # publie qu'une valeur. num_ctx_max : 32768, le palier le plus haut (contexte déclaré 262 144).
  # family bonsai2 (décision d'Anaël du 2026-10-23) : famille à part, ni qwen (lignée de leurs
  # bases) ni bonsai (Bonsai 1 bit de première génération : bonsai:8b-q1_0, bonsai:27b-q1_0).
  # Effet : la mesure qwen_bias de la calibration (AD-16, family == "qwen") les compte non-Qwen.
  models:
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-2B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "qwen3.5:2b", family: qwen, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-4B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "qwen3.5:4b", family: qwen, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "hf.co/prism-ml/Ternary-Bonsai-2-9B-gguf:Q2_0", family: bonsai2, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
    - {tag: "qwen3.5:9b", family: qwen, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
grading:
  judge: opus
# Overwolf (overlay de la tour) reste listé par nvidia-smi : toléré par son nom, la règle de
# mémoire à vide continue de s'appliquer.
gpu_check:
  allowed_processes: [Overwolf.exe]
