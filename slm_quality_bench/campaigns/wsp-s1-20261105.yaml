# Campagne wsp-s1-20261105 : séance s1 (exploratoire) du projet slm-weight-editing, édition de la
# ligne </think> de token_embd sur Qwen3.5-0.8B. qwen3.5-s1:0.8b est le modèle édité, construit par
# slm-weight-editing et créé localement par `ollama create`. Il se compare à l'original
# (qwen3.5:0.8b) et au report de l'édition du MIT (qwen3.5-wsp:0.8b) mesurés dans wsp-20261104,
# sous la même version d'Ollama (0.40.14) : ils ne sont pas remesurés ici.
# Famille qwen, Q8_0, pistes think_off et think_on.
# Mêmes réglages que wsp-20261104 (set, K = 1, plafonds, paliers, contrôle du GPU, juge, version
# d'Ollama) ; seuls l'identifiant et la liste des modèles diffèrent.
# Projection de durée : ~5 h, au plus 2 à 5 h si l'édition réduit les boucles tronquées en think_on
# (référence : qwen3.5:0.8b dans full-20261018, 5,1 h, think_off 0,9 h et think_on 4,2 h). Au plus
# 20 h par modèle, sinon STOP dès que les premières lignes projettent au-delà.
# Prérequis (dépôt slm-weight-editing, voir son README) : GGUF de la séance s1, puis
# `ollama create qwen3.5-s1:0.8b -f <Modelfile de la séance s1>` ;
# `$env:QUALITY_BENCH_MACHINE = "tour-rtx3050"` ;
# `precheck --campaign wsp-s1-20261105` (digest et capacités du modèle édité à confirmer) avant
# `generate`, dans un terminal à part.
set: set-v3
# Version d'Ollama attendue (precheck et generate refusent une autre version) : 0.40.14, celle de
# wsp-20261104, pour comparer au même moteur.
ollama_version: "0.40.14"
generation:
  request: {temperature: 0, seed_base: 0, k: 1}
  caps: {think_off: {default: 4096, rag: 2048}, think_on: {default: 4096, reasoning: 4096, rag: 2048}}
  num_ctx_tiers: [4096, 8192, 16384, 32768]
  # family qwen : famille existante. Valeurs think du modèle édité À CONFIRMER par `precheck` (/api/show)
  # avant `generate`. num_ctx_max : 32768, palier le plus haut.
  models:
    - {tag: "qwen3.5-s1:0.8b", family: qwen, tracks: [think_off, think_on], think_off: false, think_on: true, num_ctx_max: 32768}
grading:
  judge: opus
# Overwolf (overlay de la tour) reste listé par nvidia-smi : toléré par son nom, la règle de
# mémoire à vide continue de s'appliquer.
gpu_check:
  allowed_processes: [Overwolf.exe]
