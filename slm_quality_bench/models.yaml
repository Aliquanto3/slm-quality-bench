# Registre des modèles (AD-18, schéma qb.models/1), lu par common/registry.load_models.
# Une entrée par tag Ollama, publiée dans models[] de slm-quality-results.json.
# `family` est ici la seule source (biais de famille du juge, AD-16) ; `moe`, `params_*_b`
# (milliards de paramètres, total et actifs par token), `context_length` (tokens) et `capabilities`
# (chat, tools, thinking, vision) viennent de `ollama show` et des fiches publiques. Valeur
# inconnue : null ; valeur déduite (du tag par exemple) ou incertaine : une note dans `sources`
# (« à vérifier par ollama show »). Chaque source
# porte `ref` (fiche Ollama ou Hugging Face, ou copie figée du catalogue de wavelocalai) et `date`
# du relevé (AAAA-MM-JJ), `note` facultative.
